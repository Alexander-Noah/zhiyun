server:
  # Spring Boot HTTP ??????? Vite ?????????????
  port: 8080

spring:
  config:
    import: optional:file:.local-dev-secrets.properties
  application:
    # ????????????????????
    name: Backend
  datasource:
    # MySQL ????????smart_lab_basic ?????????
    url: ${SMART_LAB_DB_URL:jdbc:mysql://localhost:3306/smart_lab_basic}
    # ???????
    username: ${SMART_LAB_DB_USERNAME:root}
    # ???????????????????????????????
    password: ${SMART_LAB_DB_PASSWORD:root}
    # MySQL JDBC ????
    driver-class-name: com.mysql.cj.jdbc.Driver

# =============================
# MyBatis ??
# =============================
mybatis:
  # ??????? mybatis-config.xml??????? Spring Boot ????
  check-config-location: false
  # ?????????????????????
  type-handlers-package: com.smartlab.basic.handler
  # Mapper XML ?????
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # ??????????????? Java ?????


    map-underscore-to-camel-case: true

# =============================
# ???? / DashScope ??????
# =============================
tongyi:
  agent:
    # ?????? AI ?????
    enabled: true
    # DashScope OpenAI ???????
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # ????????
    model: qwen-plus
    # ????/???????????????? TONGYI_VISION_MODEL ???????
    vision-model: qwen-vl-plus
    # DashScope API Key?????????????????????????
    api-key: ${DASHSCOPE_API_KEY:${TONGYI_API_KEY:}}

# =============================
# ??????
# =============================
speech:
  vosk:
    # Vosk ???????????? VOSK_MODEL_PATH ???????
    model-path: ${VOSK_MODEL_PATH:../vosk-model-small-cn-0.22/vosk-model-small-cn-0.22}

# =============================
# ???????????
# =============================
timetable:
  crawler:
    # ?? Python ????????????
    python: ${TIMETABLE_CRAWLER_PYTHON:}
    # ?????????
    script-path: ${TIMETABLE_CRAWLER_SCRIPT:Python/crawl_school_timetable.py}
    # ?????????????
    import-script-path: ${TIMETABLE_IMPORT_SCRIPT:Python/parse_and_import_timetable.py}
    # ?????????
    working-dir: ${TIMETABLE_CRAWLER_WORKDIR:Python}
    # ?????????????
    timeout-seconds: ${TIMETABLE_CRAWLER_TIMEOUT_SECONDS:600}
    # ????????????
    headless: ${TIMETABLE_CRAWLER_HEADLESS:true}

# =============================
# ?????????
# =============================
smart-lab:
  security:
    jwt:
      # ???? JWT ??????
      enabled: true
      # JWT ????????????? SMART_LAB_JWT_SECRET ??????
      secret: ${SMART_LAB_JWT_SECRET:}
      # JWT ??????????????? token ???
      issuer: ${SMART_LAB_JWT_ISSUER:smart-lab}
      # JWT ????????7200 ??? 2 ???
      expiration-seconds: 7200
    password:
      # ????????????????????????
      iterations: 120000
    cors:
      # ??????????????????????
      allowed-origins: ${SMART_LAB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
      # ?????????????????????????
      allowed-origin-patterns: ${SMART_LAB_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,tauri://localhost,http://tauri.localhost}
    headers:
      # ????????????
      enabled: true
    login-rate-limit:
      # ????? IP ?????????
      max-attempts: 5
      # ?????????????????
      lock-seconds: 900
  iot:
    # ????????????
    enabled: true
    # ????????????????
    timeout: 5s
    # ?????????????? application-iot-example.yaml?
    devices: []
  oss:
    # ??????? OSS ?????
    enabled: ${SMART_LAB_OSS_ENABLED:false}
    # OSS endpoint??? oss-cn-hangzhou.aliyuncs.com?
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    # OSS bucket ???
    bucket: ${ALIYUN_OSS_BUCKET:zhibi1}
    # OSS AccessKey ID?
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    # OSS AccessKey Secret?
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    # ????????????? CDN ? bucket ?????
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:zhibi1.oss-cn-beijing.aliyuncs.com}
    # ?????????
    avatar-dir: ${ALIYUN_OSS_AVATAR_DIR:zhiyun}  

# =============================
# OpenAPI / Swagger ????
# =============================
springdoc:
  api-docs:
    enabled: ${SMART_LAB_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SMART_LAB_SWAGGER_UI_ENABLED:false}
  # ????????????????????
  packages-to-scan: org.example.backend.controller
  # ???? Controller ??? OpenAPI ???
  paths-to-match: /**
